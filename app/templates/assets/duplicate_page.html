{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-5xl mx-auto">
    <div class="flex items-center justify-between">
        <a href="/assets/{{ asset.id }}"
            class="group flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-black transition">
            <span class="w-6 h-6 border-2 border-gray-300 group-hover:border-black flex items-center justify-center transition">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
                </svg>
            </span>
            Voltar ao Ativo
        </a>
        <span class="font-mono text-xs text-gray-400 uppercase">Duplicação de Ativo</span>
    </div>
</div>

{% include "assets/duplicate_modal.html" %}
{% endblock %}
