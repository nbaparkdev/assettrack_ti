{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-4xl mx-auto">
    <div class="border-2 border-black bg-white p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <span class="font-mono text-xs text-gray-400 uppercase tracking-widest block mb-2">Administração //</span>
                <h1 class="text-3xl font-black text-black uppercase tracking-tighter leading-none">{% if webhook %}Editar Webhook{% else %}Novo Webhook{% endif %}</h1>
            </div>
            <a href="/admin/webhooks"
                class="bg-white border-2 border-black text-black px-6 py-3 font-bold uppercase text-xs tracking-widest hover:bg-black hover:text-white transition shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] hover:shadow-none hover:translate-x-[1px] hover:translate-y-[1px]">
                &larr; Voltar
            </a>
        </div>
    </div>

    <form method="POST" action="{% if webhook %}/admin/webhooks/{{ webhook.id }}/edit{% else %}/admin/webhooks/new{% endif %}" class="border-2 border-black bg-white p-6 space-y-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
        
        <div>
            <label class="block font-bold text-xs uppercase tracking-widest text-black mb-2 font-mono">Nome de Identificação</label>
            <input type="text" name="nome" value="{{ webhook.nome if webhook else '' }}" required
                class="w-full border-2 border-black bg-gray-50 p-3 font-mono text-sm focus:outline-none focus:ring-0 focus:border-black focus:bg-amber-50 transition"
                placeholder="Ex: Integração ERP Financeiro">
        </div>

        <div>
            <label class="block font-bold text-xs uppercase tracking-widest text-black mb-2 font-mono">URL de Destino (Método POST)</label>
            <input type="url" name="url" value="{{ webhook.url if webhook else '' }}" required
                class="w-full border-2 border-black bg-gray-50 p-3 font-mono text-sm focus:outline-none focus:ring-0 focus:border-black focus:bg-amber-50 transition"
                placeholder="https://sua-api.com.br/webhook">
        </div>

        <div>
            <label class="flex items-center gap-3 cursor-pointer group">
                <div class="relative flex items-center justify-center">
                    <input type="checkbox" name="is_active" value="true" class="peer sr-only" {% if not webhook or webhook.is_active %}checked{% endif %}>
                    <div class="w-6 h-6 border-2 border-black bg-white peer-checked:bg-black transition-colors"></div>
                    <svg class="absolute w-4 h-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <span class="font-bold text-sm uppercase text-black font-mono tracking-widest group-hover:text-amber-600 transition">Webhook Ativo</span>
            </label>
        </div>

        <div class="pt-4 border-t-2 border-dashed border-gray-300">
            <h3 class="font-bold text-sm uppercase tracking-widest text-black mb-4 font-mono">Saídas (Eventos) Inscritos</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {% for event in events %}
                <label class="flex items-start gap-3 p-3 border-2 border-gray-200 hover:border-black transition cursor-pointer group bg-gray-50 hover:bg-amber-50">
                    <div class="relative flex items-center justify-center mt-1">
                        <input type="checkbox" name="eventos" value="{{ event }}" class="peer sr-only" 
                        {% if webhook and event in eventos_selecionados %}checked{% endif %}>
                        <div class="w-5 h-5 border-2 border-black bg-white peer-checked:bg-black transition-colors"></div>
                        <svg class="absolute w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <div>
                        <span class="block font-bold text-sm uppercase text-black font-mono">{{ event }}</span>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="pt-6">
            <button type="submit"
                class="w-full bg-black text-white border-2 border-black p-4 font-black uppercase text-sm tracking-widest hover:bg-white hover:text-black transition shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px]">
                {% if webhook %}Salvar Alterações{% else %}Cadastrar Webhook{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
